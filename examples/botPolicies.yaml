# botPolicies.yaml — config for Anubis running with the Zoraxy adapter
#
# Mount this into the Anubis container:
#   docker run -v ./botPolicies.yaml:/data/botPolicies.yaml ...

# CRITICAL for Zoraxy forward-auth: DENY must be 403, not 200.
# If left at 200 (the Anubis default), denied bots get a "pass" signal
# and slip through.
status_codes:
  CHALLENGE: 200
  DENY: 403

bots:
  # Block known garbage scrapers
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml

  # Block AI crawlers (GPTBot, ClaudeBot, etc.)
  # Options: ai-block-aggressive / ai-block-moderate / ai-block-permissive
  - import: (data)/meta/ai-block-aggressive.yaml

  # Let legit search engines through
  - import: (data)/crawlers/_allow-good.yaml

  # Challenge Firefox AI preview
  - import: (data)/clients/x-firefox-ai.yaml

  # Block x.ai scraper
  - import: (data)/crawlers/xai.yaml

  # Don't block robots.txt, .well-known, favicon etc
  - import: (data)/common/keep-internet-working.yaml

  # Challenge anything calling itself a bot/crawler
  - name: generic-bot-catchall
    user_agent_regex: (?i:bot|crawler|spider|scrape)
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

# Weight thresholds — Anubis scores each request and picks a challenge
# based on how suspicious it looks. These defaults are fine for most sites.
thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW
  - name: mild-suspicion
    expression:
      all: [weight > 0, weight < 10]
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1
  - name: moderate-suspicion
    expression:
      all: [weight >= 10, weight < 20]
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2
  - name: high-suspicion
    expression:
      all: [weight >= 20, weight < 30]
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4
  - name: extreme-suspicion
    expression: weight >= 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 6

dnsbl: false
honeypot:
  enabled: true
  implementation: naive

openGraph:
  enabled: false

store:
  backend: memory
