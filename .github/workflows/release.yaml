name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          PLUGIN="zoraxy-anubis-adapter"
          for TARGET in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            OUTPUT="${PLUGIN}_${GOOS}_${GOARCH}"
            [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "$OUTPUT" .
            echo "built $OUTPUT"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: zoraxy-anubis-adapter_*
